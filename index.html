<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fiammetta · Magikal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2c2 6 9 9 9 17a9 9 0 0 1-18 0c0-4 2-6 3-8 0 3 1 5 3 5 0-5 1-10 3-14z' fill='%23d9480f'/%3E%3Cpath d='M16 14c1 3 4 4 4 8a4 4 0 0 1-8 0c0-3 2-4 4-8z' fill='%23f59f00'/%3E%3C/svg%3E">
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1f1b16;--muted:#6f655a;--line:#e6dfd5;--accent:#d9480f;--accent2:#f59f00;--good:#2b8a3e;--warn:#e67700;--bad:#c92a2a;--side:#2b2320;--side-ink:#f1e9df;--radius:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 8px;line-height:1.2}
h2{font-size:22px;font-weight:650}
h3{font-size:15px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-size:12px}
.muted{color:var(--muted)}.small{font-size:13px}.right{text-align:right}.nowrap{white-space:nowrap}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .flame{width:28px;height:28px;flex:none}
.brand b{font-size:19px;font-weight:700;letter-spacing:.01em}
.brand small{display:block;color:#b9ab9c;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{background:none;border:0;color:#d8cdbf;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--accent);color:#fff}
.side .foot{margin-top:auto;font-size:12px;color:#b9ab9c;padding:8px 10px;line-height:1.6}
.side .foot button{background:none;border:1px solid #5a4a40;color:#e9ddd0;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px;margin-top:6px}
.main{padding:22px 26px 60px;max-width:1240px;width:100%}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:0 1px 2px rgba(40,30,20,.04)}
.card.wide{grid-column:1/-1}
.kpi{font-size:28px;font-weight:700;letter-spacing:-.01em;margin:2px 0 4px}
.kpi.sm{font-size:20px}
.sub{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:#eee7dd;color:#5b4f44;vertical-align:middle}
.pill.good{background:#e3f4e6;color:#1f6b31}.pill.warn{background:#fff0d6;color:#9a4f00}.pill.bad{background:#fde3e3;color:#9c1c1c}.pill.plain{background:#f0ebe4}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:700;border-top:2px solid #d8cfc4;background:#fbf9f6}
tr.sub td{color:var(--muted)}
tr.stima td{color:#8a6d3b;font-style:italic}
tr.sec td{background:#f3eee7;font-weight:650;color:#4a3f36;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #cfc5b8;background:#fff;border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13.5px;font-weight:500}
.btn:hover{border-color:#a89c8e;background:#fbf8f4}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:#c23f0b}
.btn.sm{padding:3px 8px;font-size:12.5px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid #cfc5b8;border-radius:8px;padding:7px 9px;background:#fff;width:100%}
.field input:focus,.field select:focus{outline:2px solid #f6c9a8;border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row .field{flex:1 1 140px;margin-bottom:6px}
.alert{border-left:4px solid var(--accent2);background:#fff7e6;padding:9px 12px;border-radius:8px;font-size:13.5px;margin:8px 0}
.alert.bad{border-color:var(--bad);background:#fdeaea}
.alert.good{border-color:var(--good);background:#eaf6ec}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 26px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(40,30,20,.08)}
.login-card h1{font-size:26px}.login-card h1 em{color:var(--accent);font-style:normal}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:4px 0 10px}
.loading{padding:60px;text-align:center;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(30,20,10,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:14px;padding:20px 22px;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{font-size:18px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25)}
details.piano{border:1px solid var(--line);border-radius:var(--radius);background:#fff;margin-bottom:10px}
details.piano>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
details.piano>summary::-webkit-details-marker{display:none}
details.piano>summary .nm{font-weight:650;flex:1 1 200px}
details.piano .body{padding:0 16px 14px;overflow:auto}
.bar{height:6px;background:#eee7dd;border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.good{background:var(--good)}.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li:last-child{border-bottom:0}
.list li>div:first-child{flex:1 1 auto;min-width:0}
.list .d{color:var(--muted);font-size:12.5px}
.list .right{flex:none}
.search{border:1px solid #cfc5b8;border-radius:8px;padding:7px 10px;width:100%;max-width:320px}
.scroll{overflow:auto}
h3 a.lnk,.kpi a.lnk{color:inherit;text-decoration:none;border-bottom:1px dashed #c9b9a6}
h3 a.lnk:hover,.kpi a.lnk:hover,.sub a.lnk:hover{color:var(--accent)}
.sub a.lnk{color:inherit;text-decoration:underline dotted}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding:8px 10px;overflow-x:auto;gap:4px;z-index:10}
  .brand{padding:0 8px 0 2px}.brand small{display:none}.brand b{font-size:16px}
  .nav{flex-direction:row}.nav button{padding:7px 10px;white-space:nowrap;font-size:13.5px}
  .side .foot{display:none}
  .main{padding:14px 12px 50px}
  .kpi{font-size:24px}
}
</style>
</head>
<body>
<div id="app"><div class="loading">Avvio…</div></div>

</html>
